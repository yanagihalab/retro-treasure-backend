<!doctype html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RELIC RAID - Checkpoint</title>
  <link rel="stylesheet" href="/static/vendor/leaflet.css?v=relic-button-icons-fit-20260702" />
  <link rel="stylesheet" href="/static/css/style.css?v=relic-button-icons-fit-20260702" />
</head>

<body data-page="checkpoint">
  <div class="device-shell">
    <div class="screen-frame">
      <div class="shell">
        <main class="grid">
          <section class="panel checkpoint-map-panel">
            <div class="panel-head">
              <h2>MAP</h2>
              <div class="meta">一覧クリックでピンを強調</div>
            </div>
            <div id="checkpointMap" class="leaflet-map"></div>
            <div class="checkpoint-map-summary">
              <span>ROUTE STATUS</span>
              <strong id="checkpointMapSummary">読込中...</strong>
            </div>
            <div id="checkpointMapLegend" class="meta" style="margin-top: 8px">
              ピンを押すと入力欄に QR を入れます。
            </div>
          </section>

          <section class="panel stack">
            <div class="panel-head">
              <h2>チェックポイント入力</h2>
              <div id="cpStatusMini" class="meta">読込中...</div>
            </div>
            <input id="qrTextInput" type="text" placeholder="QR1 / QR2 / ... / QR24" />
            <div class="actions-row">
              <button id="claimCheckpointBtn" type="button">報酬を受け取る</button>
            </div>
            <div id="checkpointResult" class="muted">まだ受け取っていません。</div>
          </section>

          <section class="panel stack">
            <div class="panel-head">
              <h2>選択中ノード</h2>
              <div class="meta" id="selectedCheckpointCode">未選択</div>
            </div>
            <div id="selectedCheckpointDetail" class="stack muted">
              マップまたは一覧からチェックポイントを選択してください。
            </div>
          </section>

          <section class="panel stack">
            <div class="panel-head">
              <h2>チェックポイント一覧</h2>
            </div>
            <div id="checkpointMasterList" class="stack muted">
              読み込み中...
            </div>
          </section>

          <section class="panel stack">
            <div class="panel-head">
              <h2>到達履歴</h2>
            </div>
            <div id="checkpointHistoryList" class="stack muted">
              読み込み中...
            </div>
          </section>
        </main>
      </div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="/static/vendor/leaflet.js?v=relic-button-icons-fit-20260702"></script>
  <script src="/static/js/transitions.js?v=relic-button-icons-fit-20260702"></script>
  <script src="/static/js/checkpoint.js?v=relic-button-icons-fit-20260702"></script>
</body>

</html>
