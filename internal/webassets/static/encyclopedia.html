<!doctype html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RELIC RAID - カード図鑑</title>
  <link rel="stylesheet" href="/static/css/style.css?v=relic-button-icons-fit-20260702" />
</head>

<body data-page="encyclopedia">
  <div class="device-shell">
    <div class="screen-frame">
      <div class="shell">
        <main class="grid">
          <section class="panel">
            <div class="archive-summary">
              <p id="encyclopediaRate" class="completion">達成率: -</p>
              <div class="archive-filters" role="group">
                <button class="tab active" data-card-filter="all">
                  ALL
                </button>
                <button class="tab" data-card-filter="heart">
                  心
                </button>
                <button class="tab" data-card-filter="tech">
                  技
                </button>
                <button class="tab" data-card-filter="body">
                  体
                </button>
                <button class="tab" data-card-filter="owned">
                  所持
                </button>
                <button class="tab" data-card-filter="missing">
                  未所持
                </button>
              </div>
            </div>
            <div id="encyclopediaList" class="grid-select-layout muted">
              読み込み中...
            </div>
          </section>
        </main>
      </div>
    </div>
  </div>
  <div id="toast" class="toast hidden"></div>
  <script src="/static/js/transitions.js?v=relic-button-icons-fit-20260702"></script>
  <script src="/static/js/encyclopedia.js?v=relic-button-icons-fit-20260702"></script>
</body>

</html>
