<!doctype html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RELIC RAID</title>
  <link rel="stylesheet" href="/static/css/style.css?v=relic-button-icons-fit-20260702" />
</head>

<body data-page="home">
  <div id="authView" class="device-shell battle-device">
    <div class="screen-frame">
      <div class="shell">
        <main class="grid">
          <section class="panel auth-panel">
            <div class="actions-row">
              <button class="tab" data-tab="login">ログイン</button>
              <button class="tab active" data-tab="register">新規登録</button>
            </div>
            <div class="hidden" data-tab-body="login">
              <form id="loginForm" class="stack">
                <label>ユーザー名<input type="text" name="username" required minlength="3" maxlength="20" /></label>
                <label>パスワード<input type="password" name="password" required minlength="8" maxlength="72" /></label>
                <button type="submit">ログイン</button>
              </form>
            </div>
            <div class="stack" data-tab-body="register">
              <form id="registerForm" class="stack">
                <label>ユーザー名<input type="text" name="username" required minlength="3" maxlength="20" /></label>
                <label>パスワード<input type="password" name="password" required minlength="8" maxlength="72" /></label>
                <button type="submit">登録して始める</button>
              </form>
              <div class="actions-row">
                <button id="quickStartBtn" class="secondary">かんたん開始</button>
                <button id="quickStartBtn2" class="secondary">かんたん開始（チュートリアル）</button>
              </div>
            </div>
          </section>
        </main>
      </div>
    </div>
  </div>
  <div id="gameView" class="device-shell hidden">
    <div class="screen-frame">
      <div class="shell">
        <main class="grid">
          <section class="panel">
            <button id="logoutBtn">Logout</button>
            <button id="claimBonusBtn">DAILY REWARD</button>
          </section>
        </main>
      </div>
    </div>
  </div>
  <div id="toast" class="toast hidden"></div>
  <script src="/static/js/transitions.js?v=relic-button-icons-fit-20260702"></script>
  <script src="/static/js/index.js?v=relic-button-icons-fit-20260702"></script>
</body>

</html>
