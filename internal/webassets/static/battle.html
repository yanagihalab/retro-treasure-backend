<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Boss Battle</title>
    <link
      rel="stylesheet"
      href="/static/css/style.css?v=relic-button-icons-fit-20260702"
    />
  </head>
  <body class="battle-only special-battle" data-page="battle">
    <div class="device-shell battle-device">
      <div class="screen-frame battle-screen">
        <div class="shell battle-shell">
          <main class="grid">
            <section class="panel battle-panel">
              <div class="battlefield">
                <section class="battle-section boss-section">
                  <div id="bossUnit" class="boss-unit">
                    <div id="bossPortrait" class="portrait-art"></div>
                    <div class="unit-name" id="bossName"></div>
                  </div>
                </section>
                <section class="battle-section deck-section">
                  <div class="deck-grid battlefield-deck-grid" id="deckList">
                  </div>
                </section>
                <section class="battle-section log-section">
                  <!-- <button id="resumeBattle">進行</button> -->
                  <div id="battleLog" class="battle-log-box">
                    <div class="list-item">戦闘を開始してください。</div>
                  </div>
                </section>
              </div>
            </section>
          </main>
        </div>
        <div id="startBattleOverlay" class="defeat-overlay">
          <button id="startAutoBattleBtn" class="battle-start-button" type="button">
            <span class="battle-start-main">耐久戦 開始</span>
          </button>
        </div>
        <div id="defeatOverlay" class="defeat-overlay hidden">
          <div class="defeat-popup">
            <div class="defeat-title">全滅…</div>
            <div class="defeat-subtitle">デッキは力尽きた</div>
            <div><button id="defeatReturn">戻る</button></div>
          </div>
        </div>
        <div id="victoryOverlay" class="defeat-overlay hidden">
          <div class="defeat-popup">
            <div class="defeat-title victory-title">耐久成功！</div>
            <div id="resultText1" class="defeat-subtitle"></div>
            <div id="resultText2" class="defeat-subtitle"></div>
            <div><button id="victoryReward">報酬を入手</button></div>
            <div id="resultText3" class="defeat-subtitle"></div>
            <div id="resultText4" class="defeat-subtitle"></div>
            <div id="resultText5" class="defeat-subtitle"></div>
            <div id="resultText6" class="defeat-subtitle"></div>
            <div><button id="victoryReturn" class="hidden">戻る</button></div>
          </div>
        </div>
      </div>
    </div>
    <div id="toast" class="toast hidden"></div>
    <script src="/static/js/transitions.js?v=relic-button-icons-fit-20260702"></script>
    <script src="/static/js/battle.js?v=relic-button-icons-fit-20260702"></script>
  </body>
</html>
