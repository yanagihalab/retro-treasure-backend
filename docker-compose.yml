services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: retro-treasure-backend
    environment:
      APP_NAME: retro-treasure-api
      APP_HOST: 0.0.0.0
      APP_PORT: 8080
      APP_BASE_PATH: /games
      DB_ENABLED: "true"
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_NAME: relic_raid
      DB_USER: relic_raid_app
      DB_PASSWORD: ${RELIC_RAID_DB_PASSWORD:-relic-raid-dev-only}
      DB_STATE_KEY: primary
    depends_on:
      mariadb:
        condition: service_healthy
    ports:
      - "8080:8080"
    restart: unless-stopped

  mariadb:
    image: mariadb:10.11
    environment:
      MARIADB_DATABASE: relic_raid
      MARIADB_USER: relic_raid_app
      MARIADB_PASSWORD: ${RELIC_RAID_DB_PASSWORD:-relic-raid-dev-only}
      MARIADB_ROOT_PASSWORD: ${RELIC_RAID_DB_ROOT_PASSWORD:-relic-raid-root-dev-only}
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - relic-raid-mariadb:/var/lib/mysql
    restart: unless-stopped

volumes:
  relic-raid-mariadb:
